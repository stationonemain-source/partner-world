<aside class="preview" aria-label="Preview notice">Preview &middot; sample leads and money, nothing is real yet</aside>
<header class="bar" id="bar" hidden>
  <a class="logo" href="#home" aria-label="Station Partner World, home"><span class="tiles" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Station Partner World</span></a>

    <a href="#home" data-tab="home">Home</a>

    <a href="#money" data-tab="money">Money</a>

<main id="main" tabindex="-1"></main>

  <a href="#calls" data-tab="calls"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg><span>Calls</span></a>

</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>

    <div class="sheet-head"><h2 id="sheetTitle">What do I say?</h2><button class="icon-btn" id="sheetClose" type="button" aria-label="Close">&times;</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="coach" id="coach" hidden><div class="coach-ring" id="coachRing"></div><div class="coach-bubble" id="coachBubble" role="dialog" aria-modal="true" aria-labelledby="coachText"><p class="coach-step" id="coachStep"></p><p id="coachText"></p><div class="coach-btns"><button type="button" class="link-btn" id="coachSkip">Skip the tour</button><button type="button" class="btn btn-dark" id="coachNext">Next</button></div></div></div>
